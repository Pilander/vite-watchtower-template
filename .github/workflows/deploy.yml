name: Build & Deploy

# ─────────────────────────────────────────────────────────────────────────────
# SETUP (one-time per new repo):
#   1. Change PROJECT_NAME below to your project's slug (lowercase, no spaces).
#      This becomes the image name: ghcr.io/pilanderinc/PROJECT_NAME
#   2. If your app lives in a subdirectory (e.g. frontend/), set BUILD_CONTEXT.
#      Default is the repo root (".").
#   3. Ensure WATCHTOWER_URL / WATCHTOWER_TOKEN are available as secrets:
#        - Public repo → inherited from PilanderInc org secrets automatically.
#        - Private repo → set per-repo:
#            gh secret set WATCHTOWER_URL   --repo PilanderInc/<repo> --body "https://watchtower.pilander.com"
#            gh secret set WATCHTOWER_TOKEN --repo PilanderInc/<repo> --body "<token>"
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/pilanderinc/PROJECT_NAME
  BUILD_CONTEXT: .

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Watchtower (non-fatal)
        env:
          WATCHTOWER_URL: ${{ secrets.WATCHTOWER_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          if [ -z "$WATCHTOWER_URL" ] || [ -z "$WATCHTOWER_TOKEN" ]; then
            echo "::warning::WATCHTOWER_URL/TOKEN not set — skipping trigger, relying on poll interval"
            exit 0
          fi
          curl -sf -m 15 -H "Authorization: Bearer $WATCHTOWER_TOKEN" \
            "$WATCHTOWER_URL/v1/update" \
            && echo "Watchtower update triggered." \
            || echo "::warning::Watchtower trigger failed — image is pushed; relying on poll interval"
