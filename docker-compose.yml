services:
  PROJECT_NAME:
    image: ghcr.io/pilander/PROJECT_NAME:latest
    container_name: PROJECT_NAME
    restart: unless-stopped
    volumes:
      - /mnt/pool/apps/dockge/example:/example
    environment:
      example: ${example}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.PROJECT_NAME.rule=Host(`PROJECT_NAME.pilander.com`)
      - traefik.http.routers.PROJECT_NAME.entrypoints=web
      - traefik.http.routers.PROJECT_NAME.tls=false
      - traefik.http.services.PROJECT_NAME.loadbalancer.server.port=80
      - com.centurylinklabs.watchtower.enable=true

networks:
  proxy:
    external: true
